# Runs on every commit (via .beads/hooks/pre-commit) and in CI.
# Run by hand: .venv/bin/pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: no-private-data
        name: no private data (LAN addresses, tokens, home paths, SSH users)
        language: pygrep
        # Private IPv4 ranges, HA long-lived tokens (JWTs), local token files,
        # SSH logins and absolute home directories have no place in a public repo.
        entry: >-
          (?x)
          \b(?:10|127)\.\d{1,3}\.\d{1,3}\.\d{1,3}\b
          | \b172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b
          | \b192\.168\.\d{1,3}\.\d{1,3}\b
          | eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}
          | ha_token
          | \b(?:hassio|root|pi)@[\w.-]+
          | /home/[a-z_][a-z0-9_-]*/
          | /Users/[A-Za-z][\w-]*/
        exclude: ^\.pre-commit-config\.yaml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: [--unsafe]  # syntax only: HA blueprints use the !input tag

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
